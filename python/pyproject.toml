[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ess-dip"
version = "0.1.0"
description = "How many classes does a spatial field support beyond its autocorrelation? Effective-sample-size calibrated dip test for cluster homogeneity and the number of clusters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francisco Parra", email = "francisco.parra.o@usach.cl" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scikit-learn>=1.1",
  "diptest>=0.9",
]
keywords = ["clustering", "number of clusters", "cluster validity", "spatial autocorrelation",
            "effective sample size", "dip test", "remote sensing", "geostatistics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
test = ["pytest>=7", "scipy>=1.8"]

[project.urls]
Homepage = "https://github.com/franciscoparrao/ess-dip"
Source = "https://github.com/franciscoparrao/ess-dip/tree/main/python"
Issues = "https://github.com/franciscoparrao/ess-dip/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ess_dip"]

[tool.hatch.build.targets.sdist]
only-include = ["src/ess_dip", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
